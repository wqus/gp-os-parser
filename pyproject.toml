[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gp-os-parser"
version = "0.1.0"
description = "Five-source commercial property collector for GP OS"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.28,<1", "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.32,<1", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[project.scripts]
gp-os = "gp_os.cli:main"

[tool.setuptools.packages.find]
include = ["gp_os*"]

[tool.setuptools.package-data]
gp_os = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
